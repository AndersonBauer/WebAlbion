<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WEBALBION</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1 class="page-title">
        WEBALBION
    </h1>

    <!-- PESQUISA -->

    <div class="search-box">

        <input
            type="text"
            id="search-input"
            placeholder="Pesquisar item..."
        >

    </div>

    <!-- CATEGORIAS -->

    <div class="categories">

        <button
            class="category-btn active"
            data-category="todos"
        >
            Todos
        </button>

        <button
            class="category-btn"
            data-category="tronco"
        >
            Tronco
        </button>

        <button
            class="category-btn"
            data-category="tabua"
        >
            Tabua
        </button>

        <button
            class="category-btn"
            data-category="pedra"
        >
            Pedra
        </button>

        <button
            class="category-btn"
            data-category="minerio"
        >
            Minério
        </button>

        <button
            class="category-btn"
            data-category="barra"
        >
            Barra
        </button>

        <button
            class="category-btn"
            data-category="fibra"
        >
            Fibra
        </button>

        <button
            class="category-btn"
            data-category="tecido"
        >
            Tecido
        </button>

        <button
            class="category-btn"
            data-category="couro"
        >
            Couro
        </button>

    </div>

    <!-- TIERS -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-tier="todos"
        >
            Todos
        </button>

        <button
            class="filter-btn"
            data-tier="2"
        >
            T2
        </button>

        <button
            class="filter-btn"
            data-tier="3"
        >
            T3
        </button>

        <button
            class="filter-btn"
            data-tier="4"
        >
            T4
        </button>

        <button
            class="filter-btn"
            data-tier="5"
        >
            T5
        </button>

        <button
            class="filter-btn"
            data-tier="6"
        >
            T6
        </button>

        <button
            class="filter-btn"
            data-tier="7"
        >
            T7
        </button>

        <button
            class="filter-btn"
            data-tier="8"
        >
            T8
        </button>

    </div>

    <!-- CARDS -->

    <div id="cards-container"></div>

    <script src="js/data.js"></script>

    <script src="js/main.js"></script>

</body>

</html>
